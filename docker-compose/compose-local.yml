services:
  postgres:
    image: postgres:18-alpine
    container_name: nestjs-testing
    # Durability is intentionally off: the data dir is a tmpfs that is rebuilt by
    # migrations + seeds on every `local-infra-up`. After an unclean kill the data
    # dir may be corrupt, so we must not silently restart into it.
    restart: "no"
    # max_wal_senders must be 0 when wal_level=minimal, or the server refuses to start
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - wal_level=minimal
      - -c
      - max_wal_senders=0
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=1d
      - -c
      - checkpoint_flush_after=0
      - -c
      - backend_flush_after=0
      - -c
      - wal_compression=off
      - -c
      - jit=off
      - -c
      - max_parallel_workers=0
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - track_io_timing=off
      - -c
      - random_page_cost=1.0
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
